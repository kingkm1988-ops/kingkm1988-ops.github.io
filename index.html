<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>추천 상품 모음</title><style>:root{--bg:#faf8f5;--fg:#1d1b18;--mut:#6b655c;--card:#fff;--line:#e8e2d8;--acc:#d9480f}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--fg:#f1ede6;--mut:#a39c90;--card:#1f1d1a;--line:#2e2b27;--acc:#ff8a4c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}h1{font-size:24px;margin:0 0 6px}
.notice{font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:14px 0 22px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}nav a{font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:inherit;text-decoration:none;background:var(--card)}
nav a.on{border-color:var(--acc);color:var(--acc);font-weight:600}
h2{font-size:18px;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;color:inherit;text-decoration:none}
.item img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:#fff}
.name{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{font-size:12px;color:var(--mut)}.price{font-size:14px;color:var(--acc);font-weight:700}
footer{margin-top:36px;font-size:12px;color:var(--mut)}</style></head>
<body><main><h1>추천 상품 모음</h1><div class="notice">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div><p>영상 설명란의 링크로 들어와 주세요.</p>
<footer>업데이트 2026-10-28</footer></main></body></html>
